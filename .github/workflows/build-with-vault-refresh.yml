name: Build With Vault Refresh

on:
  workflow_dispatch:
    inputs:
      vault_changed_files:
        description: "바뀐 vault 경로(쉼표 구분). Watch OneDrive 가 채운다. 비우면 강제 리프레시"
        type: string
        default: ""
  push:
    branches:
      - dev

# 생성물을 같은 OneDrive 경로에 쓰므로 두 실행이 겹치지 않게 한다.
concurrency:
  group: build-with-vault-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      # 콘텐츠의 정본이자 유일한 저장소는 개인 OneDrive 의 hsol-info-blob 폴더다(2026-09-27 부터).
      # vault 를 hsol-info-blob/vault 로 받아 기존 스크립트 경로를 그대로 쓴다. 사이트 생성기가 읽지 않는 경로는 받지 않는다.
      # 받은 직후의 생성물 해시를 적어 두고, 뒤의 게시 스텝이 실제로 바뀐 것만 OneDrive 에 되쓴다.
      - name: Pull vault from OneDrive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
        run: |
          set -euo pipefail
          node ops/scripts/with-onedrive.mjs -- rclone copy od:hsol-info-blob/vault hsol-info-blob/vault \
            --exclude "datasources/**" --exclude ".obsidian/**" --exclude "Templates/**" --exclude "Attachments/**" \
            --exclude "*.base" --exclude ".DS_Store" --transfers 16 --checkers 16 --stats-one-line --stats 30s
          echo "받은 파일: $(find hsol-info-blob/vault -type f | wc -l)개"
          mkdir -p generated
          for f in vault/object-views/site-data.json vault/object-views/onepager-ko.html vault/object-views/onepager-en.html; do
            if [ -f "hsol-info-blob/$f" ]; then echo "$(sha1sum "hsol-info-blob/$f" | cut -d' ' -f1) $f"; fi
          done > generated/pulled-generated.sha1
          cat generated/pulled-generated.sha1

      - name: Refresh site-data with Claude
        env:
          # Vercel AI Gateway 경유(직접 Anthropic 호출 없음). CI엔 OIDC가 없으므로 키 필수.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: anthropic/claude-opus-4.7
          ANTHROPIC_MAX_TOKENS: "64000"
          # vault 원본(OneDrive)이 바뀌면 Watch OneDrive 가 바뀐 경로를 넘겨 디스패치한다 -> 그 목록으로 변경 판단.
          # 코드 push 에서는 목록이 없어 스킵. 목록 없이 수동 실행하면 명시적 의도로 보고 강제.
          VAULT_CHANGED_FILES: ${{ inputs.vault_changed_files }}
          CONTENT_REFRESH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.vault_changed_files == '' && '1' || '' }}
          # 빌드 로그(build_log 테이블) 적층용. 없으면 로그 적층만 건너뛰고 리프레시는 정상.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 파이프라인 종류별 LLM 동작 토글(contentPipeline). 없으면 코드 기본값으로 폴백(빌드 정상).
          # → 대시보드 Edge Config 에서 불리언만 바꾸면 다음 빌드가 반영. GitHub secret 로 등록 필요.
          EDGE_CONFIG: ${{ secrets.EDGE_CONFIG }}
        run: npm run content:refresh:claude

      # 번역 스텝이 쪽수 검증에 Playwright 를 쓰고, PDF 스텝이 같은 렌더러를 쓴다. 한 번만 깐다.
      - name: Install Playwright chromium and CJK fonts
        run: |
          npx playwright install --with-deps chromium
          # PDF 한글 깨짐 방지용 CJK 폰트.
          sudo apt-get install -y fonts-noto-cjk

      - name: Translate one-pager to English
        env:
          # KO 원페이저를 영어로 옮긴다(vault 재생성이 아니라 번역 — KO 가 단일 진실 원천).
          # KO 가 안 바뀌었으면 스크립트가 해시로 판단해 모델을 부르지 않는다.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: anthropic/claude-opus-4.7
        run: npm run content:translate:onepager

      # 게이트를 여기서 한 번 더 돌린다. prebuild(Build 스텝)에서도 돌지만, 그건 아래 OneDrive 게시와
      # PDF 업로드가 끝난 뒤라 위반이 이미 배포된 뒤에야 빌드를 세운다 — PDF 는 OneDrive 에서 바로
      # 내려가므로 빌드 실패와 무관하게 살아 있다(PRF-149). 재생성 직후·발행 직전이 유일하게
      # 유효한 지점이다.
      - name: Gate regenerated one-pager (self-designation)
        run: npm run check:self-designation

      - name: Upload content refresh failure dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-refresh-failures-${{ github.run_id }}
          path: generated/content-refresh-failures/
          if-no-files-found: ignore

      - name: Generate site.ts from vault
        run: npm run content:generate:site-ts

      - name: Generate one-pager PDF (html -> pdf)
        run: npm run content:generate:onepager-pdf

      # 사이트는 생성물을 OneDrive 에서 바로 읽는다. 바뀐 것만 vault/object-views 에 쓴다.
      - name: Publish generated outputs to OneDrive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
        run: node ops/scripts/publish-generated.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
