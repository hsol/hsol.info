name: Build With Vault Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vault 콘텐츠의 정본은 개인 OneDrive 의 hsol-info-blob 폴더다(2026-09-27 hsol-info-blob 저장소 폐기).
      # sync-onedrive-to-blob.yml 이 올린 Blob info/vault 를 hsol-info-blob/vault 로 내려받아 기존 스크립트 경로를 그대로 쓴다.
      # 내려받은 직후의 생성물 해시를 적어 두고, 아래 업로드 스텝이 실제로 바뀐 것만 Blob 에 되올린다.
      - name: Pull vault from Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # 사이트 생성기가 읽지 않는 경로는 받지 않는다(예전 Blob 에 남은 datasources 등).
          BLOB_PULL_EXCLUDE: "datasources/,.obsidian/,Templates/,Attachments/"
        run: |
          set -euo pipefail
          node ops/scripts/pull-blob-to-vault.mjs --vault-dir hsol-info-blob/vault --clean
          mkdir -p generated
          for f in vault/object-views/site-data.json vault/object-views/onepager-ko.html vault/object-views/onepager-en.html; do
            if [ -f "hsol-info-blob/$f" ]; then echo "$(sha1sum "hsol-info-blob/$f" | cut -d' ' -f1) $f"; fi
          done > generated/pulled-generated.sha1
          cat generated/pulled-generated.sha1

      - name: Refresh site-data with Claude
        env:
          # Vercel AI Gateway 경유(직접 Anthropic 호출 없음). CI엔 OIDC가 없으므로 키 필수.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: anthropic/claude-opus-4.7
          ANTHROPIC_MAX_TOKENS: "64000"
          GIT_DIFF_BASE_SHA: ${{ github.event.before }}
          GIT_DIFF_HEAD_SHA: ${{ github.sha }}
          # vault(서브모듈) 수정이 있을 때만 자동 실행. 수동 실행(workflow_dispatch)은 명시적 의도라 강제.
          CONTENT_REFRESH_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # 빌드 로그(build_log 테이블) 적층용. 없으면 로그 적층만 건너뛰고 리프레시는 정상.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 파이프라인 종류별 LLM 동작 토글(contentPipeline). 없으면 코드 기본값으로 폴백(빌드 정상).
          # → 대시보드 Edge Config 에서 불리언만 바꾸면 다음 빌드가 반영. GitHub secret 로 등록 필요.
          EDGE_CONFIG: ${{ secrets.EDGE_CONFIG }}
        run: npm run content:refresh:claude

      # 번역 스텝이 쪽수 검증에 Playwright 를 쓰고, PDF 스텝이 같은 렌더러를 쓴다. 한 번만 깐다.
      - name: Install Playwright chromium and CJK fonts
        run: |
          npx playwright install --with-deps chromium
          # PDF 한글 깨짐 방지용 CJK 폰트.
          sudo apt-get install -y fonts-noto-cjk

      - name: Translate one-pager to English
        env:
          # KO 원페이저를 영어로 옮긴다(vault 재생성이 아니라 번역 — KO 가 단일 진실 원천).
          # KO 가 안 바뀌었으면 스크립트가 해시로 판단해 모델을 부르지 않는다.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: anthropic/claude-opus-4.7
        run: npm run content:translate:onepager

      # 게이트를 여기서 한 번 더 돌린다. prebuild(Build 스텝)에서도 돌지만, 그건 아래 blob push 와
      # PDF 업로드가 끝난 뒤라 위반이 이미 배포된 뒤에야 빌드를 세운다 — PDF 는 Blob 에서 바로
      # 내려가므로 빌드 실패와 무관하게 살아 있다(PRF-149). 재생성 직후·발행 직전이 유일하게
      # 유효한 지점이다.
      - name: Gate regenerated one-pager (self-designation)
        run: npm run check:self-designation

      # 생성물(site-data, 원페이저)은 Blob 이 정본이다. 바뀐 것만 info/vault 로 올린다.
      # OneDrive 로의 역미러는 hsol-info-blob 동기화 워크플로가 다음 회차에 한다.
      - name: Upload regenerated vault outputs to Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
          import { readFileSync, existsSync } from "node:fs";
          import { put } from "@vercel/blob";
          const token = process.env.BLOB_READ_WRITE_TOKEN;
          const pulled = new Map(
            (existsSync("generated/pulled-generated.sha1") ? readFileSync("generated/pulled-generated.sha1", "utf8") : "")
              .split("\n").filter(Boolean).map((l) => { const [h, f] = l.split(" "); return [f, h]; }),
          );
          const { createHash } = await import("node:crypto");
          const files = ["vault/object-views/site-data.json", "vault/object-views/onepager-ko.html", "vault/object-views/onepager-en.html"];
          const types = { json: "application/json", html: "text/html; charset=utf-8" };
          const changed = [];
          for (const f of files) {
            const p = `hsol-info-blob/${f}`;
            if (!existsSync(p)) continue;
            const buf = readFileSync(p);
            const h = createHash("sha1").update(buf).digest("hex");
            if (pulled.get(f) === h) continue;
            await put(`info/${f}`, buf, { access: "private", addRandomSuffix: false, allowOverwrite: true, contentType: types[f.split(".").pop()], token });
            changed.push(f);
            console.log(`uploaded info/${f}`);
          }
          if (changed.length) {
            const ref = { parentSha: process.env.GITHUB_SHA, parentRef: process.env.GITHUB_REF, workflowRunId: Number(process.env.GITHUB_RUN_ID), recordedAt: new Date().toISOString(), changed };
            await put("info/vault/object-views/hsol-info-parent-ref.json", JSON.stringify(ref, null, 2), { access: "private", addRandomSuffix: false, allowOverwrite: true, contentType: "application/json", token });
          } else {
            console.log("No regenerated vault outputs; skip upload.");
          }
          '

      - name: Upload content refresh failure dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-refresh-failures-${{ github.run_id }}
          path: generated/content-refresh-failures/
          if-no-files-found: ignore

      - name: Generate site.ts from vault
        run: npm run content:generate:site-ts

      - name: Generate one-pager PDF (html -> pdf -> Blob)
        env:
          # 없으면 로컬 PDF만 만들고 업로드는 graceful skip(빌드 실패 안 함).
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm run content:generate:onepager-pdf

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
